plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.salam.alaikum'
    compileSdk 34

    defaultConfig {
        applicationId "ma.salam.alaikum"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("$projectDir/debug.keystore")
            storePassword 'salam123'
            keyAlias 'salam'
            keyPassword 'salam123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// The app is pure framework code: zero external dependencies.
dependencies {
}
