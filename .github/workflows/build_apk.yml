name: "بناء APK لتطبيق ElectroSim Pro"

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/01a0f004-ubuntu
    paths:
      - "app/**"
      - ".github/workflows/build_apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: تثبيت Java (مطلوب لـ Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: معلومات Flutter/Dart
        run: flutter --version

      - name: توليد مجلدات المنصات (android) دون المساس بكود lib/ الحالي
        working-directory: app
        run: flutter create --platforms=android --org com.electrosimpro --project-name electrosim_pro .

      - name: تصحيح لون شاشة الإقلاع الأصلية لأندرويد (ليطابق الخلفية الداكنة للتطبيق)
        working-directory: app
        run: |
          set -e
          # flutter create يولّد خلفية بيضاء افتراضية لشاشة الإقلاع الأصلية
          # (عادة عبر @android:color/white داخل drawable/launch_background.xml
          # و drawable-v21/launch_background.xml، وأحياناً أيضاً ?android:colorBackground
          # في styles.xml) تُعرض لجزء من الثانية قبل أن يرسم Flutter أول إطار
          # له — قد تُفسَّر كـ"ومضة بيضاء". نستبدل كل مرجع أبيض معروف بلون
          # AppColors.bg الداكن (#0B1220) دفاعياً في كل الملفات ذات الصلة.
          find android/app/src/main/res -iname "launch_background.xml" -o -iname "styles.xml" | while read -r f; do
            if grep -q "white" "$f" 2>/dev/null; then
              sed -i -E 's/@android:color\/white/#FF0B1220/g; s/#FFFFFFFF/#FF0B1220/gI; s/#FFFFFF/#0B1220/gI' "$f"
              echo "تم تصحيح: $f"
              cat "$f"
            fi
          done

      - name: تنزيل الحزم (pub get)
        working-directory: app
        run: flutter pub get

      - name: تحليل الكود (فحص أخطاء ثابت، غير مُعطِّل للبناء)
        working-directory: app
        run: flutter analyze || true

      - name: اختبارات الواجهة الآلية (flutter test) — لا تُعطِّل البناء، تُحفظ نتيجتها للتشخيص
        working-directory: app
        run: |
          # ملاحظة: GitHub Actions تُشغّل خطوات run: عبر "bash -e" افتراضياً،
          # لذا لو تركنا الأمر يفشل مباشرة فإن السطر التالي (تسجيل رمز
          # الخروج) لن يُنفَّذ إطلاقاً. نعطّل -e مؤقتاً حول الأمر الحساس فقط.
          set -o pipefail
          set +e
          flutter test --reporter expanded 2>&1 | tee test_log_full.txt
          code=$?
          set -e
          echo "TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
        continue-on-error: true

      - name: توليد أيقونة التطبيق
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: بناء APK (نسخة إصدار Release)
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build_log_full.txt

      - name: تجهيز ملف APK والسجلات للتسليم (تعمل دائماً، حتى عند فشل البناء)
        if: always()
        run: |
          mkdir -p dist
          if [ -f app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp app/build/app/outputs/flutter-apk/app-release.apk dist/ElectroSimPro.apk
            sha256sum dist/ElectroSimPro.apk > dist/ElectroSimPro.apk.sha256
            echo "BUILD_OK=1" >> "$GITHUB_ENV"
          else
            echo "BUILD_OK=0" >> "$GITHUB_ENV"
          fi
          if [ -f app/build_log_full.txt ]; then
            tail -c 300000 app/build_log_full.txt > dist/last_build_log.txt
          fi
          if [ -f app/test_log_full.txt ]; then
            cp app/test_log_full.txt dist/last_test_log.txt
            echo "TEST_EXIT_CODE=${TEST_EXIT_CODE:-unknown}" > dist/last_test_result.txt
          fi
          ls -lh dist/ || true

      - name: رفع APK كـ Artifact (نسخة احتياطية سريعة من نفس التشغيل)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ElectroSimPro-apk-and-logs
          path: dist/
          retention-days: 30
          if-no-files-found: warn

      - name: حفظ APK وسجل البناء داخل الفرع نفسه (dist/) ليتمكن المستخدم/الوكيل من قراءتها عبر git pull
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ || true
          if git diff --cached --quiet; then
            echo "لا تغييرات جديدة — تخطي الحفظ"
          else
            if [ "${BUILD_OK:-0}" = "1" ]; then
              MSG="chore(apk): تحديث آلي لملف ElectroSimPro.apk (نجح البناء) [skip ci]"
            else
              MSG="chore(apk): فشل بناء APK — تم حفظ سجل التشخيص last_build_log.txt [skip ci]"
            fi
            git commit -m "$MSG"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: إنهاء الخطوة بالحالة الصحيحة (فشل الـjob فعلياً إن فشل البناء)
        if: always()
        run: |
          if [ "${BUILD_OK:-0}" != "1" ]; then
            echo "فشل بناء APK — راجع dist/last_build_log.txt في الفرع بعد انتهاء هذا التشغيل."
            exit 1
          fi
