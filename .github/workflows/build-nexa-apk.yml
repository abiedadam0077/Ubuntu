name: Build NexaBrowser APK

on:
  push:
    branches:
      - arena/01a0f984-ubuntu
    paths:
      - 'nexa-browser/**'
      - '.github/workflows/build-nexa-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: nexa-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: nexa-browser
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Prepare APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp nexa-browser/app/build/outputs/apk/release/app-release.apk dist/NexaBrowser.apk
          sha256sum dist/NexaBrowser.apk > dist/NexaBrowser.apk.sha256
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaBrowser-APK
          path: |
            dist/NexaBrowser.apk
            dist/NexaBrowser.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nexa-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/NexaBrowser.apk dist/NexaBrowser.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              dist/NexaBrowser.apk \
              dist/NexaBrowser.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "NexaBrowser v1.0.0 — Android APK" \
              --notes-file nexa-browser/RELEASE_NOTES.md
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "## NexaBrowser Android build"
            echo ""
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- APK variant: release (development signing key; not a Play Store signing configuration)"
            echo "- Source branch: ${GITHUB_REF_NAME}"
            if [ -f dist/NexaBrowser.apk ]; then
              echo "- SHA-256: $(sha256sum dist/NexaBrowser.apk | cut -d' ' -f1)"
              echo "- APK size: $(du -h dist/NexaBrowser.apk | cut -f1)"
            else
              echo "- APK was not produced; inspect the Gradle build step above."
            fi
            echo ""
            echo "VPN backend and cloud sync are not included. See nexa-browser/README.md for implemented functionality and platform limitations."
          } >> "$GITHUB_STEP_SUMMARY"
