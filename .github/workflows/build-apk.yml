name: "بناء تطبيق السلام (APK)"

on:
  push:
    paths:
      - 'salam-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build (Gradle)
        working-directory: salam-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Gather APK
        run: |
          mkdir -p out
          cp salam-app/app/build/outputs/apk/debug/*-debug.apk out/Salam-Alaikum.apk
          ls -la out

      - name: Summary
        run: |
          {
            echo "## ✅ تبدّر! تطبيق «السلام عليكم» واجد"
            echo ""
            echo "1. حمّل **Salam-Alaikum.apk** من قسم **Artifacts** فأعلى هاد الصفحة."
            echo "2. نقلو للهاتف وثبّتو (فعّل «التثبيت من مصادر غير معروفة» فالإعدادات)."
            echo "3. افتح التطبيق واستقبل السلامة 🌙 — وضغط على الشاشة كترد عليك السلامة."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salam-Alaikum-APK
          path: out/Salam-Alaikum.apk

      - name: Release on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create salam-v1.0 out/Salam-Alaikum.apk \
            --title "السلام عليكم — APK v1.0" \
            --notes "حمّل Salam-Alaikum.apk ونقلو للهاتف وثبّتو 🌙" --clobber \
            || gh release upload salam-v1.0 out/Salam-Alaikum.apk --clobber
