name: electrosim_pro
description: "ElectroSim Pro - محاكي كهرباء احترافي وتفاعلي: كهرباء البناء، الكهرباء الصناعية والإلكترونيات."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # تخزين محلي للمشاريع وإعدادات المستخدم (XP, Badges, ألوان الأسلاك...)
  shared_preferences: ^2.2.2
  # الوصول لمجلد التطبيق لحفظ/فتح/تصدير ملفات المشاريع (.esp)
  path_provider: ^2.1.1
  # مشاركة وتصدير ملفات المشروع (Export / Share)
  share_plus: ^7.2.1
  # اختيار ملف لاستيراد مشروع (Import Project)
  file_picker: ^6.1.1
  # توليد معرفات فريدة للمكونات والأسلاك
  uuid: ^4.2.2
  # تنسيق الأرقام والتواريخ
  intl: ^0.19.0
  # حفظ لقطة/تصدير صورة للمخطط
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
