name: electrosim_pro
description: "ElectroSim Pro - محاكي كهرباء احترافي وتفاعلي: كهرباء البناء، الكهرباء الصناعية والإلكترونيات."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  # مطلوب لدعم locale عربي فعلي (GlobalMaterialLocalizations) — بدونها أي
  # showDialog/showModalBottomSheet أو زر رجوع افتراضي يفشل بخطأ
  # "No MaterialLocalizations found" لأن اللغة العربية مضبوطة دون تسجيل
  # المكتبة التي تدعمها فعلياً.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any
  # تخزين محلي للمشاريع وإعدادات المستخدم (XP, Badges, ألوان الأسلاك...)
  shared_preferences: any
  # الوصول لمجلد التطبيق لحفظ/فتح/تصدير ملفات المشاريع (.esp)
  path_provider: any
  # مشاركة وتصدير ملفات المشروع (Export / Share)
  share_plus: any
  # اختيار ملف لاستيراد مشروع (Import Project)
  file_picker: any
  # توليد معرفات فريدة للمكونات والأسلاك
  uuid: any
  # تنسيق الأرقام والتواريخ
  intl: any
  # حفظ لقطة/تصدير صورة للمخطط
  path: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
